[project]
name = "llm-tool-calling-assistant"
version = "0.1.0"
description = "A tool-calling LLM assistant with a provider-neutral gateway, approval-gated writes, injection guards and an eval gate."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["httpx>=0.27", "pyyaml>=6.0"]

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8.3", "ruff>=0.6", "types-pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["assistant"]
