name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so rot (a dead URL, a moved API, a broken action) turns red on its
  # own instead of waiting for the next change.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install promtool
        run: |
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz \
            | tar xz --strip-components=1 -C /usr/local/bin prometheus-3.5.0.linux-amd64/promtool
          promtool --version
      - run: uv sync --locked
      - run: make check

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
